<h2>ניהול הגרלות</h2>

<p *ngIf="message" style="color: green">{{ message }}</p>

<p-table [value]="report">
  <ng-template pTemplate="header">
    <tr>
      <th>קוד מתנה</th>
      <th>זוכה</th>
      <th>תאריך</th>
      <th>פעולה</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr>
      <td>{{ item.GiftId }}</td>

      <td>
        {{ item.UserName || 'טרם הוגרל' }}
      </td>

      <td>
        {{ item.lotteryDate | date:'dd/MM/yyyy HH:mm' }}
      </td>

      <td>
        <button
          pButton
          label="בצע הגרלה"
          (click)="draw(item.GiftId)"
          [disabled]="item.UserName || loading">
        </button>
      </td>
    </tr>
  </ng-template>
</p-table>

<hr />

<h3>דו״ח הכנסות</h3>
<p>
  סך מכירות: <strong>{{ totalIncome }}</strong>
</p>

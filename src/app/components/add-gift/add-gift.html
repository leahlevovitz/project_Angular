<p-dialog header="{{id === -1 ? 'הוספת מתנה חדשה' : 'עריכת מתנה'}}"
          [(visible)]="visible"
          [modal]="true"
          [resizable]="false"
          [draggable]="false"
          [closable]="false"
          (onHide)="finish()"
          [style]="{width: '450px'}"
          [contentStyle]="{'padding': '1rem'}">

  <form [formGroup]="formGift" (ngSubmit)="saveGift()" class="p-fluid">

    <!-- שם המתנה -->
    <div class="field">
      <label for="name" class="font-bold mb-1 block">שם המתנה</label>
      <input pInputText id="name" formControlName="name" 
             [ngClass]="{'p-invalid': formGift.get('name')?.touched && formGift.get('name')?.invalid}" 
             class="w-full" />
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('name')?.touched && formGift.get('name')?.errors?.['required']">
        שדה חובה
      </small>
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('name')?.touched && formGift.get('name')?.errors?.['minlength']">
        השם חייב להכיל לפחות 5 תווים
      </small>
    </div>

    <!-- מזהה תורם -->
    <div class="field">
      <label for="donorId" class="font-bold mb-1 block">מזהה תורם</label>
      <p-inputNumber id="donorId" formControlName="donorId" [useGrouping]="false" 
                     [ngClass]="{'p-invalid': formGift.get('donorId')?.touched && formGift.get('donorId')?.invalid}" 
                     class="w-full"></p-inputNumber>
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('donorId')?.touched && formGift.get('donorId')?.errors?.['required']">
        שדה חובה
      </small>
    </div>

    <!-- סכום -->
    <div class="field">
      <label for="price" class="font-bold mb-1 block">סכום (₪)</label>
      <p-inputNumber id="price" formControlName="price" mode="currency" currency="ILS" locale="he-IL" 
                     [ngClass]="{'p-invalid': formGift.get('price')?.touched && formGift.get('price')?.invalid}" 
                     class="w-full"></p-inputNumber>
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('price')?.touched && formGift.get('price')?.errors?.['required']">
        שדה חובה
      </small>
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('price')?.touched && 
                    (formGift.get('price')?.errors?.['min'] || formGift.get('price')?.errors?.['max'])">
        הסכום חייב להיות בין 20 ל-150 ₪
      </small>
    </div>

    <!-- כמות מתנות להגרלה -->
    <div class="field">
      <label for="quantity" class="font-bold mb-1 block">כמות מתנות להגרלה</label>
      <p-inputNumber id="quantity" formControlName="quantity" [useGrouping]="false" 
                     [ngClass]="{'p-invalid': formGift.get('quantity')?.touched && formGift.get('quantity')?.invalid}" 
                     class="w-full"></p-inputNumber>
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('quantity')?.touched && formGift.get('quantity')?.errors?.['required']">
        שדה חובה
      </small>
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('quantity')?.touched && formGift.get('quantity')?.errors?.['min']">
        המספר חייב להיות לפחות 1
      </small>
    </div>

    <!-- קטגוריה -->
    <div class="field">
      <label for="category" class="font-bold mb-1 block">קטגוריה</label>
      <p-select id="category" [options]="categories" formControlName="category" optionLabel="label" optionValue="value" 
                [ngClass]="{'p-invalid': formGift.get('category')?.touched && formGift.get('category')?.invalid}" 
                class="w-full"></p-select>
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('category')?.touched && formGift.get('category')?.errors?.['required']">
        חובה לבחור קטגוריה
      </small>
    </div>

    <!-- שם קובץ תמונה -->
    <div class="field">
      <label for="image" class="font-bold mb-1 block">שם קובץ תמונה</label>
      <input pInputText id="image" formControlName="image" class="w-full" 
             [ngClass]="{'p-invalid': formGift.get('image')?.touched && formGift.get('image')?.invalid}" />
      <small class="p-error block mt-1" 
             *ngIf="formGift.get('image')?.touched && formGift.get('image')?.errors?.['required']">
        שדה חובה
      </small>
    </div>

    <!-- כפתורים -->
    <div class="flex justify-content-end gap-2 mt-4">
      <p-button label="ביטול" icon="pi pi-times" severity="secondary" (onClick)="finish()" type="button"></p-button>
      <p-button label="שמירת מתנה" icon="pi pi-check" severity="primary" [disabled]="formGift.invalid" type="submit"></p-button>
    </div>

  </form>
</p-dialog>

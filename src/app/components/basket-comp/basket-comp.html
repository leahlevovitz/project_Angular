<div class="basket-container">
  <h2 class="basket-title">סל קניות שלי</h2>

  <ng-container *ngIf="(list$ | async) as items; else loading">

    <div *ngIf="items.length === 0" class="empty-msg">
      הסל ריק כרגע 😔
    </div>

    <div class="basket-list" *ngIf="items.length > 0">
      <p-card *ngFor="let item of items" styleClass="gift-card">
        <ng-template pTemplate="header">
          <div class="card-header">
            {{ item.giftName || 'מתנה' }}
            <span *ngIf="item.quantity > 1" class="quantity-badge">x{{ item.quantity }}</span>
          </div>
        </ng-template>

        <div class="gift-content">
          <div class="image-wrapper">
            <img [src]="item.giftImage ? (item.giftImage + '.jpg') : 'assets/images/placeholder-gift.png'"
              [alt]="item.giftName || 'מתנה'" loading="lazy"
              (error)="$event.target.src='assets/images/placeholder-gift.png'" />
          </div>

          <div class="gift-details">
            <p class="gift-price">מחיר ליחידה: ₪{{ item.giftPrice }}</p>
            <p *ngIf="item.quantity > 1" class="total-item-price">
              <strong>סה"כ: ₪{{ item.giftPrice * item.quantity }}</strong>
            </p>
          </div>
        </div>

        <ng-template pTemplate="footer">
          <button pButton type="button" label="הסר מהסל" icon="pi pi-trash" class="p-button-danger"
            (click)="removeFromBasket(item.id)"></button>
        </ng-template>
      </p-card>

      <button pButton type="button" label="לרכישה" icon="pi pi-shopping-cart" class="p-button-success checkout-button"
        (click)="showPaymentDialog = true"></button>
    </div>
  </ng-container>

  <ng-template #loading>
    <div class="loading-msg">טוען סל קניות...</div>
  </ng-template>

 <p-dialog header="פרטי תשלום" [(visible)]="showPaymentDialog" [modal]="true" [closable]="true"
    [draggable]="false" [resizable]="false" class="custom-payment-dialog">
    
    <div class="payment-container">
        <p class="subtitle">הזן את פרטי האשראי להשלמת הרכישה</p>

        <div class="field-group">
            <label for="cardNumber">מספר כרטיס</label>
            <input id="cardNumber" type="text" pInputText placeholder="1234 5678 9012 3456" />
        </div>

        <div class="field-group">
            <label for="cardName">שם בעל הכרטיס</label>
            <input id="cardName" type="text" pInputText placeholder="שם מלא" />
        </div>

        <div class="row-fields">
            <div class="field-group">
                <label for="expiry">תוקף</label>
                <input id="expiry" type="text" pInputText placeholder="MM/YY" />
            </div>
            <div class="field-group">
                <label for="cvv">CVV</label>
                <input id="cvv" type="password" pInputText placeholder="123" maxlength="3" />
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <div class="dialog-actions">
            <button pButton label="ביטול" class="p-button-text p-button-secondary" (click)="showPaymentDialog = false"></button>
            <button pButton label="שלם עכשיו" class="p-button-success" (click)="completePayment()"></button>
        </div>
    </ng-template>
</p-dialog>

  <p-toast position="top-right"></p-toast>
</div>

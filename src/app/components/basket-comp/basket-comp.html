<div class="basket-container">

  <ng-container *ngIf="(list$ | async) as items; else loading">

    <div *ngIf="items.length === 0" class="empty-msg">
      הסל ריק כרגע 😔
    </div>

    <div class="basket-list" *ngIf="items.length > 0">

      <!-- רשימת מוצרים -->
      <p-card *ngFor="let item of items" styleClass="gift-card">

        <div class="gift-content">

          <!-- תמונה -->
          <div class="image-wrapper">
            <img
              [src]="item.giftImage ? (item.giftImage + '.jpg') : 'assets/images/placeholder-gift.png'"
              [alt]="item.giftName || 'מתנה'"
              loading="lazy"
              (error)="$event.target.src='assets/images/placeholder-gift.png'" />
          </div>

          <!-- פרטי מוצר -->
          <div class="gift-details">

            <!-- שורה עליונה -->
            <div class="top-row">
              <h3 class="gift-name">{{ item.giftName || 'מתנה' }}</h3>
              <span class="unit-price">₪{{ item.giftPrice }}</span>
            </div>

            <!-- שורה תחתונה -->
            <div class="bottom-row">

              <!-- שליטת כמות (UI בלבד, בלי לוגיקה חדשה)
              <div class="quantity-control">
                <button pButton type="button" 
                  class="p-button-rounded p-button-text">➖</button> -->

                <span class="quantity-number">
                 כמות מוצרים: {{ item.quantity }}
                </span>

                <!-- <button pButton type="button" 
                  class="p-button-rounded p-button-text" (click)="addGiftToBasket(item.id)">➕</button>
              </div> -->

              <!-- מחיר כולל -->
              <span class="total-price" *ngIf="item.quantity > 1">
                סה"כ: ₪{{ item.giftPrice * item.quantity }}
              </span>

            </div>
          </div>

          <!-- כפתור מחיקה בצד -->
          <div class="remove-wrapper">
            <button pButton type="button"
              class="p-button-rounded p-button-danger p-button-text"
              (click)="removeFromBasket(item.id)">
           🗑️ </button>
          </div>

        </div>

      </p-card>

      <!-- כפתור רכישה -->
      <div class="checkout-wrapper">
        <button pButton type="button"
          label="לרכישה"
          icon="pi pi-shopping-cart"
          class="p-button-success checkout-button"
          (click)="showPaymentDialog = true">
        </button>
      </div>

    </div>
  </ng-container>

  <ng-template #loading>
    <div class="loading-msg">טוען סל קניות...</div>
  </ng-template>

<p-dialog 
  header="פרטי תשלום מאובטח" 
  [(visible)]="showPaymentDialog" 
  [modal]="true" 
  [draggable]="false" 
  [resizable]="false" 
  [closable]="true"
  styleClass="custom-payment-dialog"
  [style]="{width: '100%', maxWidth: '450px'}">

  <div class="payment-container">
    
    <div class="payment-header-info">
      <i class="pi pi-lock" style="font-size: 1rem; color: #22c55e;"></i>
      <span class="subtitle">התשלום מאובטח בתקן PCI-DSS</span>
    </div>

    <div class="field-group">
      <label for="cardNumber">מספר כרטיס אשראי</label>
      <div class="p-input-icon-left">
        <i class="pi pi-credit-card"></i>
        <p-inputMask 
          id="cardNumber"
          mask="9999-9999-9999-9999" 
          placeholder="0000-0000-0000-0000"
          styleClass="w-full">
        </p-inputMask>
      </div>
    </div>

    <div class="field-group">
      <label for="cardName">שם בעל הכרטיס</label>
      <input 
        id="cardName" 
        type="text" 
        pInputText 
        placeholder="כפי שמופיע על הכרטיס" 
        class="w-full" />
    </div>

    <div class="row-fields">
      <div class="field-group flex-1">
        <label for="expiry">תוקף (MM/YY)</label>
        <p-inputMask 
          id="expiry"
          mask="99/99" 
          placeholder="MM/YY"
          styleClass="w-full">
        </p-inputMask>
      </div>

      <div class="field-group flex-1">
        <label for="cvv">קוד CVV</label>
        <div class="p-input-icon-right">
          <i class="pi pi-question-circle" pTooltip="3 ספרות בגב הכרטיס"></i>
          <input 
            id="cvv" 
            type="password" 
            pInputText 
            placeholder="123" 
            maxlength="3" 
            class="w-full" />
        </div>
      </div>
    </div>

  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-actions">
      <button 
        pButton 
        type="button"
        label="ביטול" 
        class="p-button-text p-button-secondary" 
        (click)="showPaymentDialog = false">
      </button>
      
      <button 
        pButton 
        type="button"
        label="בצע תשלום" 
        icon="pi pi-check"
        class="p-button-success p-shadow-2" 
        (click)="completePayment()">
      </button>
    </div>
  </ng-template>

</p-dialog>

  <p-toast position="top-right"></p-toast>
</div>
